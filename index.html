<style>

<body>
<div id="root"></div>

<script>
// Fallback: se o Babel falhar em compilar (erro de sintaxe) ou se o React não montar
// em até 3 segundos, mostra mensagem útil em vez de tela azul vazia.
setTimeout(function(){
  var root = document.getElementById("root");
  if (root && !root.firstChild) {
    root.innerHTML =
      '<div style="min-height:100vh;display:grid;place-items:center;padding:40px;font-family:sans-serif;background:#F5F5F7;">' +
        '<div style="max-width:520px;text-align:center;background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);">' +
          '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>' +
          '<h2 style="font-family:Sora,sans-serif;font-size:20px;margin-bottom:12px;color:#1D1D1F;">Erro ao carregar o sistema</h2>' +
          '<p style="color:#6E6E73;font-size:13.5px;line-height:1.6;margin-bottom:16px;">' +
            'Ocorreu um erro de compilação no JavaScript. Abra o <b>Console do navegador</b> ' +
            '(tecla F12 → aba Console) e procure a mensagem em vermelho.' +
          '</p>' +
          '<p style="color:#6E6E73;font-size:12px;">' +
            'Se a mensagem mencionar <code style="background:#F5F5F7;padding:2px 6px;border-radius:4px;">SyntaxError</code> ou <code style="background:#F5F5F7;padding:2px 6px;border-radius:4px;">Unexpected token</code>, ' +
            'há um erro de sintaxe no código-fonte que precisa ser corrigido.' +
          '</p>' +
        '</div>' +
      '</div>';
  }
}, 3000);
</script>

<script type="text/babel" data-presets="react">
const {useState, useMemo} = React;

const HOJE = new Date();
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const iso = (n)=> addDays(HOJE,n).toISOString().slice(0,10);
const fmtDate = (s)=> new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});
const fmtDT = (s)=> new Date(s).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const brl = (v)=> (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const initials = (s)=>{
  const p = (s||"").split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("");
  return (p || (s||"?").slice(0,2)).toUpperCase();
};
const uid = (p)=> p+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
function nextId(prefix, list){
  const nums = list.map(x=>{
    const m = String(x.id).match(/(\d+)$/);
    return m ? parseInt(m[1], 10) : 0;
  });
  const max = Math.max(0, ...nums);
  return prefix + String(max + 1).padStart(2, "0");
}

const C = {
  blue:"#007AFF", green:"#34C759", red:"#FF3B30", orange:"#FF9500",
  yellow:"#FFCC00", purple:"#AF52DE", teal:"#5AC8FA", pink:"#FF2D55",
  indigo:"#5856D6", gray:"#8E8E93",
  text:"#1D1D1F", textSub:"#6E6E73", textMuted:"#86868B"
};

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = {hasError:false, error:null}; }
  static getDerivedStateFromError(error){ return {hasError:true, error}; }
  componentDidCatch(error, info){ console.error("ErrorBoundary:", error, info); }
  render(){
    if(this.state.hasError){
      return (
        <div style={{minHeight:"100vh",display:"grid",placeItems:"center",padding:40,fontFamily:"sans-serif",background:"#F5F5F7"}}>
          <div style={{maxWidth:520,textAlign:"center",background:"#fff",padding:32,borderRadius:16,boxShadow:"0 4px 24px rgba(0,0,0,.08)"}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <h2 style={{fontFamily:"Sora,sans-serif",fontSize:20,marginBottom:12,color:"#1D1D1F"}}>Algo deu errado</h2>
            <p style={{color:"#6E6E73",fontSize:13.5,lineHeight:1.6,marginBottom:16}}>
              {String(this.state.error && this.state.error.message || this.state.error)}
            </p>
            <button onClick={()=>window.location.reload()}
              style={{padding:"8px 16px",background:"#007AFF",color:"#fff",border:0,borderRadius:8,cursor:"pointer",fontWeight:600,fontFamily:"Inter"}}>
              Recarregar
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function Avatar({name, size=32}){
  const n = name || "?";
  return <div className="avatar" title={n} style={{width:size,height:size,fontSize:size*0.38,background:avatarColor(n)}}>{initials(n)}</div>;
}
function Badge({color, children}){
  return <span className="badge" style={{background:color+"1A", color}}>{children}</span>;
}
function Bar({pct, color}){
  return <div className="bar-track"><div className="bar-fill" style={{width:Math.min(100,Math.max(0,pct))+"%", background:color}}/></div>;
}
function Stat({label, value, hint, color}){
  return <div className="card stat"><div className="stat-label">{label}</div><div className="stat-value mono" style={{color}}>{value}</div>{hint && <div className="stat-hint">{hint}</div>}</div>;
}
function Toasts({items}){
  return <div className="toasts">{items.map(t=><div key={t.id} className="toast">{t.msg}</div>)}</div>;
}
function IconButton({name, onClick, title, danger, disabled}){
  return <button className={"icon-btn"+(danger?" danger":"")} onClick={onClick} title={title} disabled={disabled}><Icon name={name} size={15}/></button>;
}
function ConfirmModal({title, message, confirmLabel, danger, onConfirm, onCancel}){
  return (
    <div className="overlay confirm" onMouseDown={e=>{ if(e.target===e.currentTarget) onCancel(); }}>
      <div className="modal" style={{maxWidth:440}}>
        <div className="modal-head"><div style={{flex:1}}><div className="modal-title">{title}</div></div><button className="modal-close" onClick={onCancel}><Icon name="close" size={16}/></button></div>
        <div className="modal-body" style={{fontSize:13.5,lineHeight:1.55}}>{message}</div>
        <div className="modal-foot">
          <button className={"btn "+(danger?"btn-danger":"btn-primary")} onClick={onConfirm}>{confirmLabel || "Confirmar"}</button>
          <button className="btn btn-secondary" onClick={onCancel}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}
function ColorPicker({value, onChange}){
  const [open, setOpen] = useState(false);
  return (
    <div style={{position:"relative"}}>
      <button type="button" className="color-swatch" style={{background:value}} onClick={()=>setOpen(o=>!o)} title="Escolher cor"/>
      {open && (
        <div className="color-palette" onMouseLeave={()=>setOpen(false)}>
          {COLOR_OPTIONS.map(c=><button key={c} style={{background:c}} onClick={()=>{ onChange(c); setOpen(false); }} title={c}/>)}
        </div>
      )}
    </div>
  );
}

function financeiroPedido(pedido){
  const prd = getProduto(pedido.produtoId);
  if(!prd) return {modo:"?", comissao:0, custo:0, margem:0, receita:0, floor:0, abaixo:false};
  const custo = custoTotal(prd);
  if(pedido.regime === "B"){
    return {modo:"B", comissao:prd.comissao, custo, margem:pedido.preco - prd.comissao - custo, receita:pedido.preco, floor:prd.floor, abaixo:pedido.preco < prd.floor};
  }
  return {modo:"A", comissao:0, custo, margem:prd.valorNosso - custo, receita:prd.valorNosso, retidoParceiro:pedido.preco - prd.valorNosso, floor:prd.floor, abaixo:pedido.preco < prd.floor};
}
function nivelVencimento(dias){
  if(dias < 0) return {label:"Vencido", color:C.red, faixa:"vencido"};
  if(dias <= 7) return {label:"≤ 7 dias", color:C.red, faixa:"7"};
  if(dias <= 15) return {label:"≤ 15 dias", color:C.orange, faixa:"15"};
  if(dias <= 30) return {label:"≤ 30 dias", color:"#FFB340", faixa:"30"};
  if(dias <= 60) return {label:"≤ 60 dias", color:C.yellow, faixa:"60"};
  if(dias <= 90) return {label:"≤ 90 dias", color:"#A0D468", faixa:"90"};
  return {label:"Ativo", color:C.green, faixa:"ativo"};
}

  const [username, setUsername] = useState("");

  const [error, setError] = useState("");

  function submit(e){
    if(e) e.preventDefault();
    const u = usuarios.find(x=>x.username.trim().toLowerCase()===username.trim().toLowerCase() && x.password === password && x.ativo);
    if(!u){ setError("Usuário ou senha inválidos, ou conta inativa."); return; }
    onLogin(u);
  }
  return (
    <div style={{minHeight:"100vh",display:"grid",placeItems:"center",background:"linear-gradient(135deg,#F5F5F7 0%,#E8E8ED 100%)",padding:20}}>

            <input className="input" value={username} onChange={e=>{setUsername(e.target.value);setError("");}} autoFocus placeholder="Digite seu usuário" autoComplete="username"/></label>

function Dashboard({pedidos, avisos, onAbrirPedido}){
  const stats = (()=>{
    const f = {vencido:0, d7:0, d15:0, d30:0, d60:0, d90:0, ativo:0};
    DATA.clientes.forEach(cl=>{
      const faixa = nivelVencimento(cl.cert.dias).faixa;
      if(faixa==="vencido") f.vencido++;
      else if(faixa==="7") f.d7++;
      else if(faixa==="15") f.d15++;
      else if(faixa==="30") f.d30++;
      else if(faixa==="60") f.d60++;
      else if(faixa==="90") f.d90++;
      else f.ativo++;
    });
    return f;
  })();
  const dinheiroEmPoder = pedidos.filter(p=>p.regime==="B" && p.pagamentoRecebido && !["concluido","cancelado"].includes(p.status)).reduce((s,p)=>s+p.preco,0);
  const comissoesAPagar = pedidos.filter(p=>p.regime==="B" && p.comissaoStatus==="liberada").reduce((s,p)=>s+(getProduto(p.produtoId)?.comissao||0),0);
  const repassesAReceber = pedidos.filter(p=>p.regime==="A" && ["a_receber","atrasado"].includes(p.repasseStatus)).reduce((s,p)=>s+(getProduto(p.produtoId)?.valorNosso||0),0);
  const aprovacoes = pedidos.filter(p=>p.precoStatus==="abaixo_do_floor");
  const vencidos = DATA.clientes.filter(c=>c.cert.dias<0);
  const vencendo = DATA.clientes.filter(c=>c.cert.dias>=0 && c.cert.dias<=30).sort((a,b)=>a.cert.dias-b.cert.dias);
  const criticos = vencidos.concat(vencendo).slice(0,6);
  const faixaList = [
    {label:"Vencidos", color:C.red, n:stats.vencido},
    {label:"0 a 7 dias", color:C.red, n:stats.d7},
    {label:"8 a 15 dias", color:C.orange, n:stats.d15},
    {label:"16 a 30 dias", color:"#FFB340", n:stats.d30},
    {label:"31 a 60 dias", color:C.yellow, n:stats.d60},
    {label:"61 a 90 dias", color:"#A0D468", n:stats.d90},
    {label:"Mais de 90", color:C.green, n:stats.ativo}
  ];
  const maxFaixa = Math.max.apply(null, faixaList.map(f=>f.n).concat([1]));
  return (
    <>
      <PageHeader title="Visão geral" subtitle="Semáforo de vencimentos, dinheiro em poder e pendências do dia"/>
      <div className="page-content">
        <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",marginBottom:20}}>
          <Stat label="Certificados ativos" value={DATA.clientes.length - stats.vencido} hint={`${stats.vencido} vencido • ${stats.d30+stats.d15+stats.d7} em 30d`}/>
          <Stat label="Dinheiro em poder" value={brl(dinheiroEmPoder)} color={C.orange} hint="Recebido e não emitido"/>
          <Stat label="Comissões a pagar" value={brl(comissoesAPagar)} color={C.blue} hint="Liberadas"/>
          <Stat label="Repasses a receber" value={brl(repassesAReceber)} color={C.red} hint="Regime A"/>
          <Stat label="Aprovações" value={aprovacoes.length} color={aprovacoes.length?C.orange:C.green} hint="Abaixo do floor"/>
        </div>
        <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(340px,1fr))"}}>
          <div className="card card-pad">
            <div className="card-head"><div className="card-title">Semáforo de vencimentos</div><span className="card-sub">por faixa</span></div>
            <div className="stack" style={{gap:12}}>
              {faixaList.map((f,i)=>(
                <div key={i}>
                  <div className="flex-between" style={{marginBottom:6}}><span className="text-sm" style={{fontWeight:500}}>{f.label}</span><span className="text-xs mono" style={{color:f.color,fontWeight:700}}>{f.n}</span></div>
                  <Bar pct={(f.n/maxFaixa)*100} color={f.color}/>
                </div>
              ))}
            </div>
          </div>
          <div className="card card-pad">
            <div className="card-head"><div className="card-title">Renovações críticas</div><span className="card-sub">≤ 30 dias</span></div>
            <div>
              {criticos.map(cl=>{
                const par = getParceiro(cl.parceiroId);
                const nv = nivelVencimento(cl.cert.dias);
                return (
                  <div key={cl.id} className="flex" style={{padding:"10px 0",borderBottom:"1px solid rgba(0,0,0,.05)"}}>
                    <Avatar name={cl.nome} size={28}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl.nome}</div>
                      <div className="text-xs muted">{cl.cert.tipo} • {par?.nome||"—"}</div>
                    </div>
                    <Badge color={nv.color}>{cl.cert.dias<0?`vencido ${Math.abs(cl.cert.dias)}d`:`${cl.cert.dias}d`}</Badge>
                  </div>
                );
              })}
              {criticos.length===0 && <div className="empty">Nenhum certificado crítico.</div>}
            </div>
          </div>
          <div className="card card-pad">
            <div className="card-head"><div className="card-title">Aprovações pendentes</div><span className="card-sub">abaixo do floor</span></div>
            {aprovacoes.length===0 && <div className="empty">Nenhuma pendente.</div>}
            <div className="stack" style={{gap:8}}>
              {aprovacoes.map(p=>{
                const cli = getCliente(p.clienteId), prd = getProduto(p.produtoId);

              })}

          </div>
          <div className="card card-pad">
            <div className="card-head"><div className="card-title">Funil de renovação</div><span className="card-sub">{avisos.length} avisos</span></div>
            <div className="stack" style={{gap:10}}>
              {DATA.etapasAviso.map(etapa=>{
                const n = avisos.filter(a=>a.status===etapa.k).length;
                return (
                  <div key={etapa.k} className="flex-between">
                    <span className="text-sm" style={{fontWeight:500}}>{etapa.label}</span>

                      <div style={{width:100}}><Bar pct={n*22} color={etapa.color}/></div>
                      <span className="text-xs mono" style={{width:20,textAlign:"right",fontWeight:700,color:etapa.color}}>{n}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

function TelaFinanceiro({pedidos, onLiberarComissao, onPagarComissao, onReceberRepasse, can}){
  const [tab, setTab] = useState("B");
  const regimeB = pedidos.filter(p=>p.regime==="B");
  const regimeA = pedidos.filter(p=>p.regime==="A");
  const totalB = regimeB.filter(p=>p.comissaoStatus==="liberada").reduce((s,p)=>s+(getProduto(p.produtoId)?.comissao||0),0);
  const totalA = regimeA.filter(p=>["a_receber","atrasado"].includes(p.repasseStatus)).reduce((s,p)=>s+(getProduto(p.produtoId)?.valorNosso||0),0);
  const obrigacao = regimeB.filter(p=>p.pagamentoRecebido && !["concluido","cancelado"].includes(p.status)).reduce((s,p)=>s+p.preco,0);
  return (
    <>
      <PageHeader title="Financeiro" subtitle="Dois regimes coexistem, por pedido — conciliação mensal obrigatória"/>
      <div className="page-content">
        <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",marginBottom:20}}>
          <Stat label="Comissões a pagar" value={brl(totalB)} color={C.blue} hint="Regime B • liberadas"/>
          <Stat label="Repasses a receber" value={brl(totalA)} color={C.purple} hint="Regime A"/>
          <Stat label="Obrigação em poder" value={brl(obrigacao)} color={C.orange} hint="Recebido e não emitido"/>
        </div>
        <div className="tabs">
          <button className={tab==="B"?"active":""} onClick={()=>setTab("B")}>Comissões a pagar ({regimeB.length})</button>
          <button className={tab==="A"?"active":""} onClick={()=>setTab("A")}>Contas a receber ({regimeA.length})</button>
        </div>
        <div className="tbl-wrap" style={{overflowX:"auto"}}>
          {tab==="B" && (
            <table className="tbl">
              <thead><tr><th>Pedido</th><th>Cliente</th><th>Parceiro</th><th>Produto</th><th>Comissão</th><th>Status</th><th>Forma pagto</th><th></th></tr></thead>
              <tbody>
                {regimeB.map(p=>{
                  const cli=getCliente(p.clienteId), par=getParceiro(p.parceiroId), prd=getProduto(p.produtoId);
                  if(!cli||!prd) return null;
                  const cor = p.comissaoStatus==="paga"?C.green : p.comissaoStatus==="liberada"?C.blue : p.comissaoStatus==="bloqueada"?C.orange : C.gray;
                  const fp = FORMAS_PAGAMENTO[par?.formaPagamento] || {label:"—"};
                  return (
                    <tr key={p.id}>
                      <td className="mono text-xs">{p.id}</td>
                      <td style={{fontWeight:600}}>{cli.nome}</td>
                      <td className="text-sm">{par?.nome||"—"}</td>
                      <td className="text-sm">{prd.nome}</td>
                      <td className="mono" style={{fontWeight:600}}>{brl(prd.comissao)}</td>
                      <td><Badge color={cor}>{p.comissaoStatus}</Badge></td>
                      <td><Badge color={C.blue}>{fp.icon} {fp.label}</Badge></td>
                      <td>
                        {can("comissao_pagar") && p.comissaoStatus==="liberada" && <button className="btn btn-sm btn-primary" onClick={()=>onPagarComissao(p)}>Pagar</button>}
                        {can("comissao_liberar") && p.comissaoStatus==="bloqueada" && p.status==="concluido" && <button className="btn btn-sm btn-secondary" onClick={()=>onLiberarComissao(p)}>Liberar</button>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
          {tab==="A" && (
            <table className="tbl">
              <thead><tr><th>Pedido</th><th>Cliente</th><th>Parceiro</th><th>Produto</th><th>Preço parceiro</th><th>Nosso valor</th><th>Status</th><th>Forma pagto</th><th>NF</th><th></th></tr></thead>
              <tbody>
                {regimeA.map(p=>{
                  const cli=getCliente(p.clienteId), par=getParceiro(p.parceiroId), prd=getProduto(p.produtoId);
                  if(!cli||!prd) return null;
                  const cor = p.repasseStatus==="recebido"?C.green : p.repasseStatus==="atrasado"?C.red : p.repasseStatus==="devolvido"?C.gray : C.orange;
                  const fp = FORMAS_PAGAMENTO[par?.formaPagamento] || {label:"—"};
                  return (
                    <tr key={p.id}>
                      <td className="mono text-xs">{p.id}</td>
                      <td style={{fontWeight:600}}>{cli.nome}</td>
                      <td className="text-sm">{par?.nome||"—"}</td>
                      <td className="text-sm">{prd.nome}</td>
                      <td className="mono text-sm">{brl(p.preco)}</td>
                      <td className="mono" style={{fontWeight:600}}>{brl(prd.valorNosso)}</td>
                      <td><Badge color={cor}>{p.repasseStatus}</Badge></td>
                      <td><Badge color={C.blue}>{fp.icon} {fp.label}</Badge></td>
                      <td className="text-xs mono">{p.nf||"—"}</td>
                      <td>
                        {can("repasse_receber") && ["a_receber","atrasado"].includes(p.repasseStatus) && <button className="btn btn-sm btn-primary" onClick={()=>onReceberRepasse(p)}>Receber</button>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </>
  );
}

        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Como troco o parceiro de um cliente?</div>
        <div className="wiki-faq-a"><b>Não troque sem autorização formal.</b> O vínculo é permanente por design — toda renovação futura deve ir para o mesmo parceiro. Exceções (parceiro encerrou atividades, cliente pediu mudança) precisam de aprovação do gestor e registro de motivo na Auditoria. Contate o admin geral.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Por que o preço do pedido está vermelho?</div>
        <div className="wiki-faq-a">Significa que o preço praticado está <b>abaixo do floor</b> do produto. O pedido entra em "Aguardando preço" e <b>não segue para emissão</b> até um gestor aprovar. Verifique se realmente é necessário esse desconto.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> A comissão está bloqueada. O que fazer?</div>
        <div className="wiki-faq-a">Comissão bloqueada = pedido ainda não concluído. Quando o pedido é marcado como <b>Concluído</b> (última etapa), a comissão é liberada automaticamente. Se não for liberada, verifique se o pedido realmente chegou à última etapa.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> O repasse do parceiro está atrasado. Como cobrar?</div>
        <div className="wiki-faq-a">O sistema sinaliza "Atrasado" no Financeiro. A régua de cobrança deve ser acionada manualmente (WhatsApp + e-mail). Registre o contato no campo de observações do pedido. Se o parceiro não emitir NF, o sistema bloqueia renovação seguinte até regularizar.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Um parceiro está vendendo tudo abaixo do floor. E agora?</div>
        <div className="wiki-faq-a">Vá em <b>Parceiros → editar → marcar como "Em revisão"</b>. Isso sinaliza internamente. Depois, avalie: vale mais a pena renegociar a comissão fixa dele ou encerrar a parceria? O sistema tem histórico de preço por parceiro — use os dados.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Cliente pagou mas o certificado não foi emitido. Para onde foi o dinheiro?</div>
        <div className="wiki-faq-a">Está em <b>"Obrigação em poder"</b> no topo do Financeiro. Não é lucro — é um valor recebido que ainda não virou entrega. Se o pedido for cancelado, registre a <b>devolução</b> (com comprovante) para zerar.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Um parceiro não respondeu ao aviso de renovação. Quem age?</div>
        <div className="wiki-faq-a">Regra de ouro: <b>se o parceiro não respondeu em X dias</b> (recomendado: 3-5), o interno assume e <b>avisa o parceiro que agiu</b>. Nunca os dois contatam o cliente simultaneamente — isso queima o contador e confunde o cliente. Use a etapa "Contato interno" no funil.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Como adicionar um item ao checklist de um produto?</div>
        <div className="wiki-faq-a">Catálogo → ícone ✏️ no produto → campo "Checklist documental" → cada linha vira um item obrigatório. O pedido novo já nasce com todos os itens em status "pendente".</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Um cliente já tem parceiro e veio direto. Posso readotá-lo?</div>
        <div className="wiki-faq-a"><b>Não.</b> Cliente que já teve parceiro nunca pode ser readotado por outro — isso gera leilão de comissão. Se o cliente veio direto e <b>nunca teve parceiro</b>, ele pode ser adotado. Caso contrário, avalie a situação com o gestor.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Como desativo um usuário sem excluir?</div>
        <div className="wiki-faq-a">Usuários → editar → campo Status = "Inativo". Ele não consegue mais fazer login, mas o histórico fica preservado na Auditoria.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Posso personalizar a ordem das etapas de Pedidos?</div>
        <div className="wiki-faq-a">Sim! Pedidos → ⚙️ Editar etapas → setas ↑↓ em cada linha. A ordem das colunas no kanban segue exatamente a ordem da lista. Só lembre que a <b>última etapa</b> dispara liberação automática de comissão.</div>
        <div className="wiki-faq-q"><span className="q-mark">Q.</span> Preciso de mais algum dado para LGPD?</div>
        <div className="wiki-faq-a">O sistema registra consentimento do cliente, log de acesso e permite exclusão de dados. Não armazene senha de certificado no sistema. Toda ação é logada em Auditoria com usuário, timestamp e detalhe.</div>
      </>
    )
  };
  return (
    <>
      <PageHeader title="Wiki" subtitle="Guia completo do sistema e perguntas frequentes"/>
      <div className="page-content">
        <div className="wiki-layout">
          <nav className="wiki-nav">
            {sections.map(s=>(
              <button key={s.k} className={secao===s.k?"active":""} onClick={()=>setSecao(s.k)}>
                <span>{s.icon}</span><span>{s.label}</span>
              </button>
            ))}
          </nav>
          <article className="card card-pad wiki-content">
            {contents[secao] || <div className="empty">Selecione um tópico.</div>}
          </article>
        </div>
      </div>
    </>
  );
}

function EtapasModal({tipo, etapas, pedidos, avisos, onSave, onRestore, onClose, toast}){
  const [draft, setDraft] = useState(etapas.map(e=>({...e})));
  const [restaurarConfirm, setRestaurarConfirm] = useState(false);
  const itens = tipo === "pedido" ? pedidos : avisos;
  const getStatus = tipo === "pedido" ? (p=>p.status) : (a=>a.status);
  const itensPorEtapa = (k)=> itens.filter(i=>getStatus(i)===k).length;
  const titulo = tipo === "pedido" ? "Pedidos" : "Renovações";
  function add(){ setDraft(d=>[...d, {k:"custom_"+Date.now().toString(36), label:"Nova etapa", color:COLOR_OPTIONS[d.length % COLOR_OPTIONS.length]}]); }
  function remove(i){
    if(draft.length <= 1){ toast("Deve haver pelo menos uma etapa."); return; }
    const k = draft[i].k;
    const count = itensPorEtapa(k);
    if(count > 0){ toast(`Há ${count} item(ns) nesta etapa. Mova-os antes de excluir.`); return; }
    setDraft(d=>d.filter((_, idx)=>idx !== i));
  }
  function move(i, dir){
    setDraft(d=>{
      const n = [...d];
      const j = i + dir;
      if(j < 0 || j >= n.length) return d;
      [n[i], n[j]] = [n[j], n[i]];
      return n;
    });
  }
  function update(i, k, v){ setDraft(d=>d.map((e, idx)=>idx === i ? {...e, [k]: v} : e)); }
  function salvar(){
    for(const e of draft){
      if(!e.label.trim()){ toast("Preencha o nome de todas as etapas."); return; }
    }
    onSave(draft);
  }
  function handleRestore(){
    if(!restaurarConfirm){ setRestaurarConfirm(true); return; }
    onRestore();
  }
  return (
    <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:600}}>
        <div className="modal-head">
          <div style={{flex:1}}>
            <div className="modal-title">Editar etapas — {titulo}</div>
            <div className="modal-sub">Personalize as colunas do kanban</div>
          </div>
          <button className="modal-close" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        <div className="modal-body">
          <div className="alert-info" style={{marginBottom:14}}>
            <Icon name="alert" size={14} style={{flexShrink:0,marginTop:1}}/>
            <span>Etapas com itens não podem ser excluídas. Mova os itens para outra etapa antes.</span>
          </div>
          <div>
            {draft.map((e, i) => {
              const count = itensPorEtapa(e.k);
              return (
                <div key={e.k} className="etapa-row">
                  <ColorPicker value={e.color} onChange={c=>update(i, "color", c)}/>
                  <input className="input" style={{flex:1}} value={e.label} onChange={ev=>update(i, "label", ev.target.value)}/>
                  {count > 0 && <span className="text-xs muted" style={{whiteSpace:"nowrap"}}>{count} item(ns)</span>}
                  <IconButton name="chevronUp" onClick={()=>move(i,-1)} disabled={i===0} title="Subir"/>
                  <IconButton name="chevronDown" onClick={()=>move(i,1)} disabled={i===draft.length-1} title="Descer"/>
                  <IconButton name="trash" onClick={()=>remove(i)} title="Excluir" danger/>
                </div>
              );
            })}
          </div>
          <button className="btn btn-secondary btn-sm" onClick={add} style={{marginTop:12}}><Icon name="plus" size={14}/> Adicionar etapa</button>
        </div>
        <div className="modal-foot">
          <button className={"btn " + (restaurarConfirm ? "btn-danger" : "btn-secondary")} onClick={handleRestore} title="Voltar etapas ao padrão original">
            <Icon name="refresh" size={14}/>{restaurarConfirm ? "Confirmar restauração" : "Restaurar padrão"}
          </button>
          <span style={{flex:1}}/>
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar}>Salvar alterações</button>
        </div>
      </div>
    </div>
  );
}

        <div className="modal-foot">
          {bloqueioPreco && can("pedido_aprovar_preco") && <button className="btn btn-primary" onClick={()=>onAprovarPreco(pedido)}><Icon name="check" size={14}/> Aprovar preço</button>}

        </div>
      </div>

}

function NovoPedidoModal({onClose, onCriar}){
  const primeira = DATA.clientes[0];
  const [clienteId, setClienteId] = useState(primeira?.id || "");
  const [produtoId, setProdutoId] = useState(DATA.produtos[0]?.id || "");
  const [preco, setPreco] = useState(DATA.produtos[0]?.preco || 0);
  const [obs, setObs] = useState("");
  const cliente = getCliente(clienteId);
  const prd = getProduto(produtoId);
  const parceiro = cliente ? getParceiro(cliente.parceiroId) : null;
  const abaixo = prd && preco < prd.floor;
  const margem = prd && cliente ? (cliente.regime==="B" ? preco - prd.comissao - custoTotal(prd) : prd.valorNosso - custoTotal(prd)) : 0;
  function trocarProduto(id){ setProdutoId(id); setPreco(getProduto(id)?.preco || 0); }
  function enviar(){ if(!cliente || !prd) return; onCriar({clienteId, produtoId, preco, obs, abaixo}); }
  return (
    <div className="overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={{maxWidth:640}}>
        <div className="modal-head">
          <div style={{flex:1}}><div className="modal-title">Novo pedido</div><div className="modal-sub">O vínculo do parceiro é herdado do cliente</div></div>
          <button className="modal-close" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        <div className="modal-body">
          <label className="field"><span className="field-label">Cliente</span>
            <select className="select" value={clienteId} onChange={e=>setClienteId(e.target.value)}>
              {DATA.clientes.map(c=><option key={c.id} value={c.id}>{c.nome} — {c.doc}</option>)}
            </select></label>
          {cliente && parceiro && <div className="alert-info" style={{marginBottom:16}}><Icon name="lock" size={14} style={{flexShrink:0,marginTop:1}}/><span><b>Origem:</b> {parceiro.nome} • regime <b>{cliente.regime}</b> • desde {fmtDate(cliente.desde)}</span></div>}
          <label className="field"><span className="field-label">Produto</span>
            <select className="select" value={produtoId} onChange={e=>trocarProduto(e.target.value)}>
              {DATA.produtos.filter(p=>p.status==="ativo").map(p=><option key={p.id} value={p.id}>{p.nome} — {p.ac} • tabela {brl(p.preco)}</option>)}
            </select></label>
          <label className="field"><span className="field-label">Preço ao cliente final (R$)</span>
            <input type="number" className="input" value={preco} onChange={e=>setPreco(Number(e.target.value)||0)}/></label>
          {prd && (
            <>
              <div className="grid" style={{gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                <div style={{background:"rgba(0,0,0,.02)",borderRadius:10,padding:"10px 12px"}}><div className="text-xs muted">Floor</div><div className="mono" style={{fontFamily:"Sora",fontWeight:700,fontSize:15,color:C.red}}>{brl(prd.floor)}</div></div>
                <div style={{background:"rgba(0,0,0,.02)",borderRadius:10,padding:"10px 12px"}}><div className="text-xs muted">Margem</div><div className="mono" style={{fontFamily:"Sora",fontWeight:700,fontSize:15,color:margem<60?C.red:C.green}}>{brl(margem)}</div></div>
              </div>
              {abaixo ? <div className="alert-danger"><Icon name="alert" size={14} style={{flexShrink:0,marginTop:1}}/><span>Preço abaixo do mínimo — entrará <b>aguardando aprovação</b>.</span></div>
                       : <div className="alert-success"><Icon name="check" size={14} style={{flexShrink:0,marginTop:1}}/><span>Preço dentro da política comercial.</span></div>}
            </>
          )}
          <div style={{marginTop:16}}>
            <label className="field"><span className="field-label">Observações</span>
              <textarea className="textarea" value={obs} onChange={e=>setObs(e.target.value)}/></label>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-primary" onClick={enviar}>Criar pedido</button>
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

function UsuarioModal({usuario, usuarios, onClose, onSave, toast}){
  const novo = !usuario?.id;
  const [form, setForm] = useState(()=> usuario ? {
    ...usuario, permissoes: {views: [...usuario.permissoes.views], tasks: [...usuario.permissoes.tasks]}
  } : {
    nome:"", username:"", password:"", cargo:"", ativo:true, isAdmin:false, master:false,
    permissoes: { views:["dashboard"], tasks:[] }
  });
  const [senhaVisivel, setSenhaVisivel] = useState(false);
  function set(k,v){ setForm(f=>({...f,[k]:v})); }
  function toggleView(k){
    setForm(f=>{
      const views = f.permissoes.views.includes(k) ? f.permissoes.views.filter(x=>x!==k) : [...f.permissoes.views, k];
      return {...f, permissoes:{...f.permissoes, views}};
    });
  }
  function toggleTask(k){
    setForm(f=>{
      const tasks = f.permissoes.tasks.includes(k) ? f.permissoes.tasks.filter(x=>x!==k) : [...f.permissoes.tasks, k];
      return {...f, permissoes:{...f.permissoes, tasks}};
    });
  }
  function toggleAllViews(){
    const all = PERMISSIONS_VIEWS.map(v=>v.k);
    const hasAll = all.every(k=>form.permissoes.views.includes(k));
    setForm(f=>({...f, permissoes:{...f.permissoes, views: hasAll ? [] : all}}));
  }
  function toggleAllTasks(){
    const all = PERMISSIONS_TASKS.map(t=>t.k);
    const hasAll = all.every(k=>form.permissoes.tasks.includes(k));
    setForm(f=>({...f, permissoes:{...f.permissoes, tasks: hasAll ? [] : all}}));
  }
  function salvar(){
    if(!form.nome.trim()){ toast("Informe o nome."); return; }
    if(!form.username.trim()){ toast("Informe o usuário."); return; }
    if(novo && !form.password.trim()){ toast("Informe a senha."); return; }
    const dup = usuarios.find(u=>u.id!==form.id && u.username.trim().toLowerCase() === form.username.trim().toLowerCase());
    if(dup){ toast(`Já existe um usuário com o login "${form.username}".`); return; }
    onSave(form);
  }
  const todasViews = PERMISSIONS_VIEWS.every(v=>form.permissoes.views.includes(v.k));
  const todasTarefas = PERMISSIONS_TASKS.every(t=>form.permissoes.tasks.includes(t.k));
  return (

          </div>
          <button className="modal-close" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <label className="field"><span className="field-label">Nome *</span><input className="input" value={form.nome} onChange={e=>set("nome", e.target.value)} placeholder="Ex.: Ana Comercial"/></label>
            <label className="field"><span className="field-label">Cargo</span><input className="input" value={form.cargo} onChange={e=>set("cargo", e.target.value)} placeholder="Ex.: Comercial"/></label>
          </div>
          <div className="form-row">
            <label className="field"><span className="field-label">Usuário (login) *</span><input className="input" value={form.username} onChange={e=>set("username", e.target.value.replace(/\s/g,""))} placeholder="sem espaços" autoComplete="off"/></label>
            <label className="field">
              <span className="field-label">Senha {novo ? "*" : "(deixe em branco para não alterar)"}</span>
              <div style={{position:"relative"}}>
                <input className="input" type={senhaVisivel?"text":"password"} value={form.password} onChange={e=>set("password", e.target.value)} placeholder={novo ? "Defina uma senha" : "Manter atual"} style={{paddingRight:44}}/>
                <button type="button" onClick={()=>setSenhaVisivel(s=>!s)} style={{position:"absolute",right:4,top:"50%",transform:"translateY(-50%)",background:"transparent",border:0,padding:6,cursor:"pointer",color:C.textMuted}} title={senhaVisivel?"Ocultar":"Mostrar"}><Icon name="eye" size={14}/></button>
              </div>
            </label>
          </div>
          <div className="form-row">
            <label className="field"><span className="field-label">Status</span>
              <select className="select" value={form.ativo?"ativo":"inativo"} onChange={e=>set("ativo", e.target.value==="ativo")}>

            <label className="field"><span className="field-label">Tipo</span>
              <div style={{padding:"9px 0",fontSize:13,color:C.textSub}}>
                {form.master ? "👑 Master (acesso total)" : form.isAdmin ? "👑 Administrador" : "Usuário comum"}

          {form.isAdmin && <div className="alert-info" style={{marginBottom:16}}><Icon name="shield" size={14} style={{flexShrink:0,marginTop:1}}/><span>Administradores têm acesso a todas as visualizações e tarefas automaticamente.</span></div>}

function App(){
  const [currentUser, setCurrentUser] = useState(null);
  const [screen, setScreen] = useState("dashboard");
  const [usuarios, setUsuarios] = useState(USERS_INICIAIS);
  const [produtos, setProdutos] = useState(PRODUTOS_INICIAIS.slice());
  const [parceiros, setParceiros] = useState(PARCEIROS_INICIAIS.slice());
  const [clientes, setClientes] = useState(CLIENTES_INICIAIS.slice());
  const [pedidos, setPedidos] = useState(PEDIDOS_INICIAIS);
  const [avisos, setAvisos] = useState(AVISOS_INICIAIS);
  const [logs, setLogs] = useState(LOGS_INICIAIS);
  const [etapasPedido, setEtapasPedido] = useState(ETAPAS_PEDIDO_PADRAO.map(e=>({...e})));
  const [etapasAviso, setEtapasAviso] = useState(ETAPAS_AVISO_PADRAO.map(e=>({...e})));
  const [toasts, setToasts] = useState([]);
  const [pedidoAberto, setPedidoAberto] = useState(null);
  const [novoPedidoAberto, setNovoPedidoAberto] = useState(false);
  const [parceiroModal, setParceiroModal] = useState(null);
  const [produtoModal, setProdutoModal] = useState(null);
  const [clienteModal, setClienteModal] = useState(null);
  const [usuarioModal, setUsuarioModal] = useState(null);
  const [etapasModal, setEtapasModal] = useState(null);
  const [confirmacao, setConfirmacao] = useState(null);

  DATA.produtos = produtos;
  DATA.parceiros = parceiros;
  DATA.clientes = clientes;
  DATA.etapasPedido = etapasPedido;
  DATA.etapasAviso = etapasAviso;

  function can(task){
    if(!currentUser) return false;
    if(currentUser.isAdmin) return true;
    return (currentUser.permissoes?.tasks||[]).includes(task);
  }
  function canView(view){
    if(!currentUser) return false;
    if(view === "wiki") return true;
    if(currentUser.isAdmin) return true;
    return (currentUser.permissoes?.views||[]).includes(view);
  }
  function toast(msg){
    const id = Math.random().toString(36).slice(2);
    setToasts(t=>t.concat([{id,msg}]));
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3500);
  }
  function logar(entidade, entidadeId, acao, detalhe){
    setLogs(l=>[{id:uid("LG"), entidade, entidadeId, acao, detalhe, usuario: currentUser?.username || "sistema", ts:new Date().toISOString()}].concat(l));
  }
  function handleLogin(u){
    setCurrentUser(u);
    const firstAllowed = PERMISSIONS_VIEWS.find(v=>u.isAdmin || (u.permissoes?.views||[]).includes(v.k));
    setScreen(firstAllowed ? firstAllowed.k : "dashboard");
    setLogs(l=>[{id:uid("LG"), entidade:"login", entidadeId:u.id, acao:"login realizado", detalhe:`${u.nome} (@${u.username}) entrou no sistema`, usuario: u.username, ts:new Date().toISOString()}].concat(l));
  }
  function handleLogout(){
    if(currentUser) logar("login", currentUser.id, "logout", "Sessão encerrada");
    setCurrentUser(null);
    setPedidoAberto(null);
    setConfirmacao(null);
  }
  function abrirPedido(p){ setPedidoAberto(p); }

  function avancarPedido(p){
    const idx = DATA.etapasPedido.findIndex(e=>e.k === p.status);
    if(idx < 0 || idx >= DATA.etapasPedido.length-1) return;
    const novoStatus = DATA.etapasPedido[idx+1].k;
    const isFinal = idx+1 === DATA.etapasPedido.length-1;
    setPedidos(list=>list.map(x=>{
      if(x.id!==p.id) return x;
      const upd = {...x, status:novoStatus};
      if((novoStatus === "concluido" || isFinal) && x.regime === "B" && x.comissaoStatus === "bloqueada"){ upd.comissaoStatus = "liberada"; }
      return upd;
    }));
    setPedidoAberto({...p, status:novoStatus});
    logar("pedido", p.id, "status alterado", `${findEtapaPedido(p.status).label} → ${findEtapaPedido(novoStatus).label}`);
    toast(`Pedido ${p.id} → ${findEtapaPedido(novoStatus).label}`);
  }
  function aprovarPreco(p){
    setPedidos(list=>list.map(x=>x.id===p.id ? {...x, precoStatus:"ok", status:"recebido"} : x));
    setPedidoAberto({...p, precoStatus:"ok", status:"recebido"});
    logar("pedido", p.id, "preço aprovado", `Preço ${brl(p.preco)} liberado`);
    toast("Preço aprovado.");
  }
  function cancelarPedido(p){
    setConfirmacao({
      title: "Cancelar pedido",
      message: `Tem certeza que deseja cancelar o pedido ${p.id}? O status mudará para "Cancelado" e a ação será registrada na auditoria. Se houver valor recebido, registre a devolução no financeiro.`,
      confirmLabel: "Sim, cancelar pedido", danger: true,
      onConfirm: ()=>{
        setPedidos(list=>list.map(x=>x.id===p.id ? {...x, status:"cancelado"} : x));
        setPedidoAberto(null);
        logar("pedido", p.id, "cancelado", "Cancelamento registrado");
        toast(`Pedido ${p.id} cancelado.`);
        setConfirmacao(null);
      }
    });
  }
  function liberarComissao(p){
    setPedidos(list=>list.map(x=>x.id===p.id ? {...x, comissaoStatus:"liberada"} : x));
    setPedidoAberto({...p, comissaoStatus:"liberada"});
    logar("comissao", p.id, "comissão liberada", "Comissão liberada");
    toast("Comissão liberada.");
  }
  function pagarComissao(p){
    setPedidos(list=>list.map(x=>x.id===p.id ? {...x, comissaoStatus:"paga"} : x));
    setPedidoAberto({...p, comissaoStatus:"paga"});
    logar("comissao", p.id, "comissão paga", "Comprovante anexado");
    toast("Pagamento registrado.");
  }
  function receberRepasse(p){
    setPedidos(list=>list.map(x=>x.id===p.id ? {...x, repasseStatus:"recebido"} : x));
    setPedidoAberto({...p, repasseStatus:"recebido"});
    logar("repasse", p.id, "repasse recebido", "Conciliado");
    toast("Repasse conciliado.");
  }
  function acaoAviso(a, novoStatus){
    const etapaDestino = findEtapaAviso(novoStatus);
    setAvisos(list=>list.map(x=>{
      if(x.id!==a.id) return x;
      const upd = {...x, status:novoStatus};
      if(novoStatus === "parceiro_ciente" || novoStatus === "reforcado") upd.interacao = iso(0);
      if(novoStatus === "contato_interno" || novoStatus === "proposta") upd.contatoInterno = iso(0);
      return upd;
    }));
    logar("aviso_renovacao", a.id, "status alterado", `${findEtapaAviso(a.status).label} → ${etapaDestino.label}`);
    toast(`Aviso ${a.id} → ${etapaDestino.label}`);
  }
  function criarPedido(dados){
    const cli = getCliente(dados.clienteId), prd = getProduto(dados.produtoId);
    if(!cli || !prd) return;
    const temAguardando = DATA.etapasPedido.some(e=>e.k==="aguardando_preco");
    const temRecebido = DATA.etapasPedido.some(e=>e.k==="recebido");
    const novoStatus = dados.abaixo && temAguardando ? "aguardando_preco" : (temRecebido ? "recebido" : (DATA.etapasPedido[0]?.k || "recebido"));
    const novo = {
      id: uid("PD"), clienteId: dados.clienteId, parceiroId: cli.parceiroId, produtoId: dados.produtoId,
      regime: cli.regime, preco: dados.preco, status: novoStatus,
      precoStatus: dados.abaixo ? "abaixo_do_floor" : "ok",
      comissaoStatus: cli.regime==="B" ? "prevista" : null,
      repasseStatus: cli.regime==="A" ? "a_receber" : null,
      pagamentoRecebido: false, criado: iso(0), nf: "",
      docs: prd.checklist.map(n=>({n, s:"pendente"})), obs: dados.obs || ""
    };
    setPedidos(prev=>[novo].concat(prev));
    logar("pedido", novo.id, "criado", `${cli.nome} • ${prd.nome} • ${brl(dados.preco)}`);
    toast(`Pedido ${novo.id} criado.`);
    setNovoPedidoAberto(false);
  }
  function salvarParceiro(form){
    if(form.id){
      setParceiros(list=>list.map(p=>p.id===form.id ? form : p));
      logar("parceiro", form.id, "atualizado", `${form.nome} — forma pagto: ${form.formaPagamento}`);
      toast(`Parceiro ${form.nome} atualizado.`);
    } else {
      const novo = {...form, id: nextId("PC", parceiros)};
      setParceiros(list=>[...list, novo]);
      logar("parceiro", novo.id, "criado", `${form.nome}`);
      toast(`Parceiro ${form.nome} cadastrado.`);
    }
    setParceiroModal(null);
  }
  function excluirParceiro(p){
    const temClientes = clientes.some(c=>c.parceiroId===p.id);
    const temPedidos = pedidos.some(x=>x.parceiroId===p.id);
    if(temClientes || temPedidos){ toast("Não é possível excluir: parceiro possui vínculos ativos. Marque como inativo."); return; }
    setConfirmacao({
      title: "Excluir parceiro", message: `Tem certeza que deseja excluir o parceiro "${p.nome}"?`,
      confirmLabel: "Sim, excluir", danger: true,
      onConfirm: ()=>{ setParceiros(list=>list.filter(x=>x.id!==p.id)); logar("parceiro", p.id, "excluído", `${p.nome}`); toast(`Parceiro ${p.nome} excluído.`); setConfirmacao(null); }
    });
  }
  function salvarProduto(form){
    if(form.id){
      setProdutos(list=>list.map(p=>p.id===form.id ? form : p));
      logar("produto", form.id, "atualizado", `${form.nome} — preço ${brl(form.preco)}`);
      toast(`Produto ${form.nome} atualizado.`);
    } else {
      const novo = {...form, id: nextId("PR", produtos)};
      setProdutos(list=>[...list, novo]);
      logar("produto", novo.id, "criado", `${form.nome}`);
      toast(`Produto ${form.nome} cadastrado.`);
    }
    setProdutoModal(null);
  }
  function excluirProduto(p){
    const temPedidos = pedidos.some(x=>x.produtoId===p.id);
    if(temPedidos){ toast("Não é possível excluir: produto possui pedidos vinculados. Marque como inativo."); return; }
    setConfirmacao({
      title: "Excluir produto", message: `Tem certeza que deseja excluir o produto "${p.nome}"?`,
      confirmLabel: "Sim, excluir", danger: true,
      onConfirm: ()=>{ setProdutos(list=>list.filter(x=>x.id!==p.id)); logar("produto", p.id, "excluído", `${p.nome}`); toast(`Produto ${p.nome} excluído.`); setConfirmacao(null); }
    });
  }
  function salvarCliente(form){
    if(form.id){
      setClientes(list=>list.map(c=>c.id===form.id ? form : c));
      logar("cliente", form.id, "atualizado", `${form.nome}`);
      toast(`Cliente ${form.nome} atualizado.`);
    } else {
      const novo = {...form, id: nextId("CL", clientes)};
      setClientes(list=>[...list, novo]);
      logar("cliente", novo.id, "criado", `${form.nome}`);
      toast(`Cliente ${form.nome} cadastrado.`);
    }
    setClienteModal(null);
  }
  function excluirCliente(c){
    const temPedidos = pedidos.some(x=>x.clienteId===c.id);
    if(temPedidos){ toast("Não é possível excluir: cliente possui pedidos vinculados."); return; }
    setConfirmacao({
      title: "Excluir cliente", message: `Tem certeza que deseja excluir o cliente "${c.nome}"?`,
      confirmLabel: "Sim, excluir", danger: true,
      onConfirm: ()=>{ setClientes(list=>list.filter(x=>x.id!==c.id)); logar("cliente", c.id, "excluído", `${c.nome}`); toast(`Cliente ${c.nome} excluído.`); setConfirmacao(null); }
    });
  }
  function salvarUsuario(form){
    if(form.id){
      setUsuarios(list=>list.map(u=>u.id===form.id ? form : u));
      if(currentUser && currentUser.id === form.id){ setCurrentUser(form); }
      logar("usuario", form.id, "atualizado", `${form.nome} — ${form.permissoes.views.length} views, ${form.permissoes.tasks.length} tarefas`);
      toast(`Usuário ${form.nome} atualizado.`);
    } else {
      const novo = {...form, id: nextId("U", usuarios)};
      if(!novo.password){ toast("Defina uma senha para o novo usuário."); return; }
      setUsuarios(list=>[...list, novo]);
      logar("usuario", novo.id, "criado", `${form.nome} (@${form.username})`);
      toast(`Usuário ${form.nome} cadastrado.`);
    }
    setUsuarioModal(null);
  }
  function excluirUsuario(u){
    if(u.master){ toast("O usuário master não pode ser excluído."); return; }
    if(currentUser && currentUser.id === u.id){ toast("Você não pode excluir a si mesmo."); return; }
    setConfirmacao({
      title: "Excluir usuário", message: `Tem certeza que deseja excluir o usuário "${u.nome}" (@${u.username})?`,
      confirmLabel: "Sim, excluir", danger: true,
      onConfirm: ()=>{ setUsuarios(list=>list.filter(x=>x.id!==u.id)); logar("usuario", u.id, "excluído", `${u.nome}`); toast(`Usuário ${u.nome} excluído.`); setConfirmacao(null); }
    });
  }
  function salvarEtapasPedido(novas){
    setEtapasPedido(novas);
    logar("etapas_pedido", "pedido", "etapas atualizadas", `Novo fluxo: ${novas.map(e=>e.label).join(" → ")}`);
    toast("Etapas de Pedidos atualizadas.");
    setEtapasModal(null);
  }
  function salvarEtapasAviso(novas){
    setEtapasAviso(novas);
    logar("etapas_aviso", "aviso", "etapas atualizadas", `Novo fluxo: ${novas.map(e=>e.label).join(" → ")}`);
    toast("Etapas de Renovações atualizadas.");
    setEtapasModal(null);
  }
  function restaurarEtapasPedido(){
    const chaves = new Set(ETAPAS_PEDIDO_PADRAO.map(e=>e.k));
    const orfaos = pedidos.filter(p=>!chaves.has(p.status));
    const destino = chaves.has("recebido") ? "recebido" : ETAPAS_PEDIDO_PADRAO[0].k;
    if(orfaos.length > 0){ setPedidos(list=>list.map(p=> chaves.has(p.status) ? p : {...p, status: destino})); }
    setEtapasPedido(ETAPAS_PEDIDO_PADRAO.map(e=>({...e})));
    logar("etapas_pedido", "pedido", "etapas restauradas ao padrão", orfaos.length > 0 ? `${orfaos.length} pedido(s) movido(s) para "${ETAPAS_PEDIDO_PADRAO.find(e=>e.k===destino).label}"` : "Sem itens órfãos");
    toast(orfaos.length > 0 ? `Etapas restauradas. ${orfaos.length} pedido(s) movido(s) para "${ETAPAS_PEDIDO_PADRAO.find(e=>e.k===destino).label}".` : "Etapas restauradas ao padrão.");
    setEtapasModal(null);
  }
  function restaurarEtapasAviso(){
    const chaves = new Set(ETAPAS_AVISO_PADRAO.map(e=>e.k));
    const orfaos = avisos.filter(a=>!chaves.has(a.status));
    const destino = chaves.has("aviso_enviado") ? "aviso_enviado" : ETAPAS_AVISO_PADRAO[0].k;
    if(orfaos.length > 0){ setAvisos(list=>list.map(a=> chaves.has(a.status) ? a : {...a, status: destino})); }
    setEtapasAviso(ETAPAS_AVISO_PADRAO.map(e=>({...e})));
    logar("etapas_aviso", "aviso", "etapas restauradas ao padrão", orfaos.length > 0 ? `${orfaos.length} aviso(s) movido(s) para "${ETAPAS_AVISO_PADRAO.find(e=>e.k===destino).label}"` : "Sem itens órfãos");
    toast(orfaos.length > 0 ? `Etapas restauradas. ${orfaos.length} aviso(s) movido(s) para "${ETAPAS_AVISO_PADRAO.find(e=>e.k===destino).label}".` : "Etapas restauradas ao padrão.");
    setEtapasModal(null);
  }

  if(!currentUser){
    return (
      <>
        <LoginScreen usuarios={usuarios} onLogin={handleLogin}/>
        <Toasts items={toasts}/>
      </>
    );
  }
  return (
    <div className="app">
      <Sidebar screen={screen} setScreen={setScreen} canView={canView} currentUser={currentUser} onLogout={handleLogout}/>
      <main className="main">
        {screen==="dashboard" && canView("dashboard") && <Dashboard pedidos={pedidos} avisos={avisos} onAbrirPedido={abrirPedido}/>}
        {screen==="pedidos" && canView("pedidos") && <TelaPedidos pedidos={pedidos} onAbrir={abrirPedido} onNovoPedido={()=>setNovoPedidoAberto(true)} onEditarEtapas={()=>setEtapasModal("pedido")} can={can}/>}
        {screen==="renovacoes" && canView("renovacoes") && <TelaRenovacoes avisos={avisos} onAcao={acaoAviso} onEditarEtapas={()=>setEtapasModal("aviso")} can={can}/>}
        {screen==="clientes" && canView("clientes") && <TelaClientes clientes={clientes} onNovo={()=>setClienteModal({})} onEditar={c=>setClienteModal(c)} onExcluir={excluirCliente} can={can}/>}
        {screen==="catalogo" && canView("catalogo") && <TelaCatalogo produtos={produtos} onNovo={()=>setProdutoModal({})} onEditar={p=>setProdutoModal(p)} onExcluir={excluirProduto} can={can}/>}
        {screen==="parceiros" && canView("parceiros") && <TelaParceiros parceiros={parceiros} pedidos={pedidos} onNovo={()=>setParceiroModal({})} onEditar={p=>setParceiroModal(p)} onExcluir={excluirParceiro} can={can}/>}
        {screen==="financeiro" && canView("financeiro") && <TelaFinanceiro pedidos={pedidos} onLiberarComissao={liberarComissao} onPagarComissao={pagarComissao} onReceberRepasse={receberRepasse} can={can}/>}
        {screen==="auditoria" && canView("auditoria") && <TelaAuditoria logs={logs}/>}
        {screen==="usuarios" && canView("usuarios") && <TelaUsuarios usuarios={usuarios} currentUser={currentUser} onNovo={()=>setUsuarioModal({})} onEditar={u=>setUsuarioModal(u)} onExcluir={excluirUsuario} can={can}/>}
        {screen==="wiki" && <TelaWiki/>}
        {!canView(screen) && screen !== "wiki" && (
          <div style={{padding:"60px 40px",textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:12}}>🔒</div>
            <div style={{fontFamily:"Sora",fontSize:18,fontWeight:700,marginBottom:6}}>Sem acesso</div>
            <div style={{color:"#86868B",fontSize:13}}>Você não tem permissão para visualizar esta página.</div>
          </div>
        )}
      </main>
      {pedidoAberto && canView("pedidos") && (
        <PedidoModal pedido={pedidos.find(p=>p.id===pedidoAberto.id) || pedidoAberto}
          onClose={()=>setPedidoAberto(null)} onAvancar={avancarPedido} onAprovarPreco={aprovarPreco}
          onCancelar={cancelarPedido} onLiberarComissao={liberarComissao} onPagarComissao={pagarComissao}
          onReceberRepasse={receberRepasse} can={can}/>
      )}
      {novoPedidoAberto && can("pedido_criar") && <NovoPedidoModal onClose={()=>setNovoPedidoAberto(false)} onCriar={criarPedido}/>}
      {parceiroModal && <ParceiroModal parceiro={parceiroModal} onClose={()=>setParceiroModal(null)} onSave={salvarParceiro} toast={toast}/>}
      {produtoModal && <ProdutoModal produto={produtoModal} onClose={()=>setProdutoModal(null)} onSave={salvarProduto} toast={toast}/>}
      {clienteModal && <ClienteModal cliente={clienteModal} onClose={()=>setClienteModal(null)} onSave={salvarCliente} toast={toast}/>}
      {usuarioModal && <UsuarioModal usuario={usuarioModal} usuarios={usuarios} onClose={()=>setUsuarioModal(null)} onSave={salvarUsuario} toast={toast}/>}
      {etapasModal === "pedido" && <EtapasModal tipo="pedido" etapas={etapasPedido} pedidos={pedidos} avisos={avisos} onSave={salvarEtapasPedido} onRestore={restaurarEtapasPedido} onClose={()=>setEtapasModal(null)} toast={toast}/>}
      {etapasModal === "aviso" && <EtapasModal tipo="aviso" etapas={etapasAviso} pedidos={pedidos} avisos={avisos} onSave={salvarEtapasAviso} onRestore={restaurarEtapasAviso} onClose={()=>setEtapasModal(null)} toast={toast}/>}
      {confirmacao && <ConfirmModal title={confirmacao.title} message={confirmacao.message} confirmLabel={confirmacao.confirmLabel} danger={confirmacao.danger} onConfirm={confirmacao.onConfirm} onCancel={()=>setConfirmacao(null)}/>}
      <Toasts items={toasts}/>
    </div>
  );
}

(function(){
  try {
    const root = document.getElementById("root");
    if (ReactDOM.createRoot) ReactDOM.createRoot(root).render(<ErrorBoundary><App/></ErrorBoundary>);
    else ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>, root);
  } catch(err) {
    console.error(err);
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;font-family:sans-serif"><h2>Erro</h2><pre style="font-size:12px;white-space:pre-wrap;">'+(err.message||err)+'</pre></div>';
  }
})();
</script>
</body>
</html>
